; ============================================================
;  PlatformIO Project Configuration
;  Board  : ESP32-DevKitC
;  Target : Robot Power-On Functional Test
;
;  Requires espressif32 platform >= 6.0.0 which bundles
;  arduino-esp32 v3.x (needed for ledcAttach / ledcWrite API)
; ============================================================

[env:esp32dev]
platform  = espressif32@^6.0.0
board     = esp32dev
framework = arduino

; Serial monitor baud rate – must match Serial.begin() in firmware
monitor_speed = 115200

; Optional: auto-reset board before uploading
; upload_speed = 921600
